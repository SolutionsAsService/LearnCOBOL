<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnCOBOL — 32 COBOL programs, read line by line</title>
<meta name="description" content="Thirty-two COBOL sample programs with their real source, the 80-column fixed format they were written to, and what each one teaches.">
<meta name="author" content="SolutionsAsService">
<link rel="stylesheet" href="styles.css">
<script>
  /* Set the theme before first paint so the page never flashes the wrong stock. */
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* private mode: fall back to the system preference */ }
  })();
</script>
</head>
<body>

<a class="skip" href="#view">Skip to content</a>

<header class="bar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">&#9670;</span>
    <span>LearnCOBOL</span>
  </div>
  <input id="search" class="bar__search" type="search" placeholder="Filter programs&hellip;" autocomplete="off" aria-label="Filter programs">
  <button id="theme-toggle" class="btn" type="button" aria-pressed="false">Dark mode</button>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Programs">
    <h2>Browse</h2>
    <ul class="sidebar__nav">
      <li><a href="#/" data-nav="overview">Overview</a></li>
      <li><a href="#/card" data-nav="card">The 80-column card</a></li>
      <li><a href="#/divisions" data-nav="divisions">The four divisions</a></li>
      <li><a href="#/run" data-nav="run">Run one</a></li>
    </ul>
    <h2>Programs</h2>
    <div id="groups"></div>
  </nav>

  <main class="view" id="view" tabindex="-1"></main>
</div>

<noscript>
  <p style="padding: 1rem">
    Reading the programs needs JavaScript: every figure and every listing is
    rendered from <code>programs.js</code>, which is generated from the
    <code>.cbl</code> files. The sources are readable directly in the
    repository: <a href="https://github.com/SolutionsAsService/LearnCOBOL/tree/main/programs">browse the programs folder</a>.
  </p>
</noscript>

<script src="programs.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
